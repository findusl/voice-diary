version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    assignees:
      - findusl
    reviewers:
      - findusl
    open-pull-requests-limit: 10
    ignore:
      # Kotlin 2.4.x supports Gradle only through 9.5. Revisit this ceiling when
      # a newer Kotlin minor expands the official compatibility matrix.
      - dependency-name: gradle-wrapper
        versions:
          - "> 9.5.0"
      # Kotlin 2.4.x officially supports AGP through 9.1.0; 9.1.1 is a tested
      # patch-level exception. Revisit when a newer Kotlin minor supports more.
      - dependency-name: com.android.tools.build:gradle
        versions:
          - "> 9.1.1"
      - dependency-name: com.android.application
        versions:
          - "> 9.1.1"
      - dependency-name: com.android.kotlin.multiplatform.library
        versions:
          - "> 9.1.1"
    groups:
      toolchain:
        patterns:
          - gradle-wrapper
          - com.android.tools.build:gradle
          - com.android.application
          - com.android.kotlin.multiplatform.library
          - org.gradle.toolchains.*
          - org.jetbrains.kotlin.*
          - org.jetbrains.compose*
      libraries:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    assignees:
      - findusl
    reviewers:
      - findusl
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    assignees:
      - findusl
    reviewers:
      - findusl
    groups:
      base-images:
        patterns:
          - "*"
